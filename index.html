<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050608">
  <title>The Raven Portrait</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="portrait" class="portrait" aria-label="A raven watching over a moonlit Victorian cemetery">
    <div class="scene-drift">
      <div class="layer cemetery" aria-hidden="true"></div>
      <div class="layer vignette" aria-hidden="true"></div>
      <div class="moon-haze" aria-hidden="true"></div>
      <div id="raven" class="raven raven--normal" aria-hidden="true">
        <img id="raven-image" src="assets/raven/normal.svg" alt="">
      </div>
      <div class="foreground" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
    </div>
    <aside id="debug-panel" class="debug-panel" hidden>
      <strong>Portrait workshop</strong>
      <button data-action="blink">Blink <kbd>B</kbd></button>
      <button data-action="ruffle">Ruffle <kbd>R</kbd></button>
      <button data-action="head-left">Look left <kbd>←</kbd></button>
      <button data-action="head-right">Look right <kbd>→</kbd></button>
      <button data-action="normal">Still <kbd>N</kbd></button>
    </aside>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
