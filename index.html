<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Raven Portrait</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <div id="scene">
      <!-- 1. Cemetery background, raven removed (production base layer) -->
      <div class="layer layer-hero" id="layer-hero"></div>

      <!-- 2. Far fog — painted overlay, sits behind the raven -->
      <div class="layer layer-fog layer-fog-far" id="layer-fog-far"></div>

      <!-- 3. Raven sprite renderer — two stacked layers crossfade between
           pose states so transitions never hard-swap. Production mode. -->
      <div class="layer layer-raven" id="layer-raven">
        <img class="raven-frame" id="raven-layer-a" alt="" draggable="false" />
        <img class="raven-frame" id="raven-layer-b" alt="" draggable="false" />
      </div>

      <!-- 3b. Clip-path raven — fallback only, used if raven-normal.png
           fails to load. Hidden entirely in production sprite mode. -->
      <div class="layer layer-raven-overlay" id="layer-raven-overlay" hidden></div>
      <div class="layer layer-blink" id="layer-blink" hidden></div>

      <!-- 4. Near fog — painted overlay, passes in front of the raven -->
      <div class="layer layer-fog layer-fog-near" id="layer-fog-near"></div>

      <!-- 5. Day/night colour treatment -->
      <div class="layer layer-daynight" id="layer-daynight"></div>

      <!-- 6. Cloud / overcast darkness treatment -->
      <div class="layer layer-clouds" id="layer-clouds"></div>

      <!-- 7. Rain -->
      <canvas class="layer layer-rain" id="layer-rain"></canvas>

      <!-- 8. Lightning -->
      <div class="layer layer-lightning" id="layer-lightning"></div>

      <!-- 9. Foreground framing / vignette -->
      <div class="layer layer-vignette"></div>
    </div>
  </div>

  <div id="debug-panel" hidden>
    <div id="debug-title">DEBUG</div>
    <div id="debug-log"></div>
    <div class="debug-hint">
      b=blink r=ruffle h=head-turn v=look-at-viewer l=lightning<br />
      1=rain 2=fog 3=night 4=storm 0=reset<br />
      a/i/s/w=ACTIVE/IDLE/SLEEP/AWAY<br />
      c=calibration click-mode &nbsp; d=hide panel
    </div>
  </div>

  <script src="config.js"></script>
  <script src="weather.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
