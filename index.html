<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Raven Portrait</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <div id="scene">
      <!-- 1. Cemetery background, raven removed (production base layer) -->
      <div class="layer layer-hero" id="layer-hero"></div>

      <!-- 2. Far fog — painted overlay, sits behind the raven -->
      <div class="layer layer-fog layer-fog-far" id="layer-fog-far"></div>

      <!-- 3. Raven — a static resting image, replaced by a real-time
           WebGL-composited video clip whenever a gesture is playing. The
           canvas sits on top of (and is mutually exclusive with) the
           static image — see README "How the raven animates". -->
      <div class="layer layer-raven" id="layer-raven">
        <div class="raven-base" id="raven-base"></div>
        <canvas class="raven-video-canvas" id="raven-video-canvas"></canvas>
      </div>

      <!-- 4. Near fog — painted overlay, passes in front of the raven -->
      <div class="layer layer-fog layer-fog-near" id="layer-fog-near"></div>

      <!-- 5. Day/night colour treatment -->
      <div class="layer layer-daynight" id="layer-daynight"></div>

      <!-- 6. Cloud / overcast darkness treatment -->
      <div class="layer layer-clouds" id="layer-clouds"></div>

      <!-- 7. Rain -->
      <canvas class="layer layer-rain" id="layer-rain"></canvas>

      <!-- 8. Lightning -->
      <div class="layer layer-lightning" id="layer-lightning"></div>

      <!-- 9. Foreground framing / vignette -->
      <div class="layer layer-vignette"></div>
    </div>
  </div>

  <!-- Hidden, preloaded gesture-video sources. Muted (autoplay-safe) and
       never inserted into the visible layout — app.js reads frames from
       these into the WebGL canvas above. -->
  <div class="raven-video-sources" aria-hidden="true">
    <video id="video-blink" muted playsinline preload="auto"></video>
    <video id="video-ruffle" muted playsinline preload="auto"></video>
    <video id="video-headLeft" muted playsinline preload="auto"></video>
    <video id="video-lookViewer" muted playsinline preload="auto"></video>
    <video id="video-subtle" muted playsinline preload="auto"></video>
  </div>

  <div id="debug-panel" hidden>
    <div id="debug-title">DEBUG</div>
    <div id="debug-log"></div>
    <div class="debug-hint">
      b=blink r=ruffle h=head-turn u=subtle v=look-at-viewer<br />
      l=lightning 1=rain 2=fog 3=night 4=storm 0=reset<br />
      a/i/s/w=ACTIVE/IDLE/SLEEP/AWAY &nbsp; d=hide panel
    </div>
  </div>

  <script src="config.js"></script>
  <script src="weather.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
