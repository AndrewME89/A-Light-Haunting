<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Raven Portrait</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <div id="scene">
      <!-- 1. Cemetery background + raven, single painted hero scene -->
      <div class="layer layer-hero" id="layer-hero"></div>

      <!-- Optional sprite-mode raven (used automatically if cutout PNGs exist) -->
      <img id="raven-sprite" class="layer layer-raven-sprite" alt="" draggable="false" hidden />
      <div class="layer layer-raven-sprite layer-raven-sprite-eye" id="raven-sprite-eye" hidden></div>

      <!-- Clip-path mode raven overlay (used when no sprite assets are present) -->
      <div class="layer layer-raven-overlay" id="layer-raven-overlay"></div>
      <div class="layer layer-blink" id="layer-blink"></div>

      <!-- 2. Day/night colour treatment -->
      <div class="layer layer-daynight" id="layer-daynight"></div>

      <!-- 3. Cloud / darkness treatment -->
      <div class="layer layer-clouds" id="layer-clouds"></div>

      <!-- 4. Fog -->
      <div class="layer layer-fog layer-fog-far" id="layer-fog-far"></div>
      <div class="layer layer-fog layer-fog-near" id="layer-fog-near"></div>

      <!-- 7. Rain -->
      <canvas class="layer layer-rain" id="layer-rain"></canvas>

      <!-- 8. Lightning -->
      <div class="layer layer-lightning" id="layer-lightning"></div>

      <!-- 9. Foreground framing / vignette -->
      <div class="layer layer-vignette"></div>
    </div>
  </div>

  <div id="debug-panel" hidden>
    <div id="debug-title">DEBUG</div>
    <div id="debug-log"></div>
    <div class="debug-hint">
      b=blink r=ruffle h=head-turn l=lightning<br />
      1=rain 2=fog 3=night 4=storm 0=reset<br />
      a/i/s/w=ACTIVE/IDLE/SLEEP/AWAY<br />
      c=calibration click-mode &nbsp; d=hide panel
    </div>
  </div>

  <script src="config.js"></script>
  <script src="weather.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
